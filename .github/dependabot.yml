version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Chicago
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: America/Chicago
    open-pull-requests-limit: 2
    groups:
      go-modules:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /console
    schedule:
      interval: weekly
      day: monday
      time: "10:00"
      timezone: America/Chicago
    open-pull-requests-limit: 2
    groups:
      console-packages:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /website
    schedule:
      interval: weekly
      day: monday
      time: "10:30"
      timezone: America/Chicago
    open-pull-requests-limit: 2
    groups:
      website-packages:
        patterns:
          - "*"
    # typescript-eslint rejects TypeScript 7 (#471 failed the Site check),
    # so the website keeps TypeScript 6 until the toolchain supports 7.
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
