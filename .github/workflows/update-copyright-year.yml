name: Update Copyright Year

on:
  schedule:
    # Run at 00:05 UTC on January 1st
    - cron: '5 0 1 1 *'
  workflow_dispatch: # Allow manual trigger

jobs:
  update-copyright:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Get current year
      id: year
      run: echo "YEAR=$(date +%Y)" >> "$GITHUB_OUTPUT"
    
    - name: Update the copyright range in LICENSE and README.md
      run: |
        # The LICENSE appendix and the README notice line own the range 2025-<current year>.
        sed -i "s/Copyright (C) 2025-[0-9]\{4\}  AgentStation/Copyright (C) 2025-${{ steps.year.outputs.YEAR }}  AgentStation/" LICENSE
        sed -i "s/Copyright 2025-[0-9]\{4\} AgentStation, AGPL-3.0-only/Copyright 2025-${{ steps.year.outputs.YEAR }} AgentStation, AGPL-3.0-only/" README.md
    
    - name: Check if changes were made
      id: changes
      run: |
        if git diff --quiet; then
          echo "NO_CHANGES=true" >> "$GITHUB_OUTPUT"
        else
          echo "NO_CHANGES=false" >> "$GITHUB_OUTPUT"
        fi
    
    - name: Create Pull Request
      if: steps.changes.outputs.NO_CHANGES == 'false'
      uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        commit-message: 'chore: update copyright year to ${{ steps.year.outputs.YEAR }}'
        title: 'chore: update copyright year to ${{ steps.year.outputs.YEAR }}'
        body: |
          ## Automated Copyright Year Update
          
          This PR automatically updates the copyright range in LICENSE and README.md to ${{ steps.year.outputs.YEAR }}.
          
          ### Changes
          - Updated copyright year from previous year to ${{ steps.year.outputs.YEAR }}
          
          ### Note
          This is an automated PR created by the `update-copyright-year` workflow.
        branch: update-copyright-${{ steps.year.outputs.YEAR }}
        delete-branch: true
        labels: |
          documentation
          automated
