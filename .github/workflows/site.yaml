# Site builds the public site in website/ and deploys it to Cloudflare.
#
# The Site job runs on each pull request and each push to main that changes
# the site or its content. It checks, tests, and builds the site, and uploads
# the static files as an artifact. It deploys nothing.
#
# The Deploy job runs after a Release run that a tag push started completes
# with success. It builds the site at the released commit, names the release
# from the version tag at that commit, and deploys the static files to the
# starport-site Worker. The Release workflow publishes with GITHUB_TOKEN, so a
# release event never starts this workflow; the completed run does. A Release
# run that completed before this trigger existed, for example v1.3.0, never
# starts a deploy. A maintainer can also start the workflow by hand with a git
# reference, for example after a recovered release.
#
# Before the first deploy, a maintainer creates the starport-site environment
# with required reviewers and the CLOUDFLARE_API_TOKEN and
# CLOUDFLARE_ACCOUNT_ID secrets. Without these secrets, the Deploy job runs
# and fails. It is not skipped. The first deploy step names each missing
# secret.
#
# A run by hand builds the site as of the reference that it gets. An earlier
# reference deploys the site as of that reference. This is a rollback of the
# live site, not a refresh. A failed run leaves the last deployment in place.
name: Site

on:
  pull_request:
    paths:
      - "website/**"
      - "docs/site/**"
      - "docs/assets/first-use-v1.2.0/**"
      - "console/src/docs/areas.ts"
      - "console/src/favicon.svg"
      - "console/scripts/build-docs.mjs"
      - "README.md"
      - "go.mod"
      - ".github/workflows/site.yaml"
  push:
    branches: [main]
    paths:
      - "website/**"
      - "docs/site/**"
      - "docs/assets/first-use-v1.2.0/**"
      - "console/src/docs/areas.ts"
      - "console/src/favicon.svg"
      - "console/scripts/build-docs.mjs"
      - "README.md"
      - "go.mod"
      - ".github/workflows/site.yaml"
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      ref:
        description: "Git reference to deploy, for example v1.3.0 or a commit"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: site-${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_run') && 'deploy' || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  site:
    name: Site
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Install the site package manager
        run: npm install -g pnpm@11.22.0

      - name: Install dependencies
        run: pnpm -C website install --frozen-lockfile

      - name: Lint
        run: pnpm -C website lint

      - name: Test
        run: pnpm -C website test

      - name: Build
        run: pnpm -C website build

      - name: Upload site artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: starport-site
          path: website/out
          if-no-files-found: error

  deploy:
    name: Deploy
    # A Release run that a maintainer started by hand recovers an existing
    # release at the main head, not at the tag. It deploys nothing here; the
    # maintainer starts this workflow with the tag.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: starport-site
    steps:
      # Stop before the build when the environment lacks a deploy secret, so
      # the failure names the secret and not a wrangler error.
      - name: Require Cloudflare secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          MISSING=()
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then MISSING+=(CLOUDFLARE_API_TOKEN); fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then MISSING+=(CLOUDFLARE_ACCOUNT_ID); fi
          if [ "${#MISSING[@]}" -gt 0 ]; then
            echo "::error::the starport-site environment is missing ${MISSING[*]}; add the secrets and run the workflow again"
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.event.workflow_run.head_sha }}
          fetch-tags: true
          persist-credentials: false

      # GITHUB_SHA and GITHUB_REF_NAME name the reference that started the
      # run, not the deployed reference. Set the release and the link commit
      # from the checkout so the manifest and the repository links name the
      # deployed source. After a Release run, the checkout is the released
      # commit and the one version tag at that commit names the release.
      - name: Set release facts
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ inputs.ref }}
        run: |
          if [[ "$EVENT" == workflow_run ]]; then
            TAGS=$(git tag --points-at HEAD | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$' || true)
            COUNT=$(printf '%s' "$TAGS" | grep -c . || true)
            if [[ "$COUNT" != 1 ]]; then
              printf '::error::expected one version tag at %s, found %s: %s\n' "$(git rev-parse HEAD)" "$COUNT" "${TAGS:-none}" | tr '\n' ' '
              echo
              exit 1
            fi
            REF=$TAGS
          fi
          if [[ "$REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            printf 'STARPORT_DOCS_RELEASE=%s\n' "$REF" >> "$GITHUB_ENV"
          else
            printf 'STARPORT_DOCS_RELEASE=dev\n' >> "$GITHUB_ENV"
          fi
          printf 'STARPORT_DOCS_COMMIT=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Install the site package manager
        run: npm install -g pnpm@11.22.0

      - name: Install dependencies
        run: pnpm -C website install --frozen-lockfile

      - name: Build
        run: pnpm -C website build

      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        run: pnpm -C website exec wrangler deploy
