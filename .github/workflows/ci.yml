name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read
  pull-requests: read
  security-events: write

env:
  GO_VERSION_STABLE: '1.22'
  GO_VERSION_LATEST: '1.23'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION_STABLE }}
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.1
          args: --timeout=5m

  test:
    name: Test (Go ${{ matrix.go-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        go-version: ['1.21', '1.22', '1.23']
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run tests (Unix)
        if: runner.os != 'Windows'
        run: go test -v -race -coverprofile=coverage.txt -covermode=atomic ./...
      
      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        run: go test -v -race "-coverprofile=coverage.txt" "-covermode=atomic" ./...

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.go-version == env.GO_VERSION_STABLE
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: ./coverage.txt
          flags: unittests
          name: codecov-umbrella

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION_STABLE }}
          cache: true

      - name: Build binary
        run: make build

      - name: Test binary
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            ./starport.exe --version
            ./starport.exe help
          else
            ./starport --version
            ./starport help
          fi

      - name: Build release binary
        run: make release

      - name: Check binary size (Unix)
        if: runner.os != 'Windows'
        run: |
          ls -lh starport
          size=$(stat -c%s starport 2>/dev/null || stat -f%z starport)
          echo "Binary size: $size bytes"
          # Fail if binary is larger than 10MB
          if [ $size -gt 10485760 ]; then
            echo "Binary size exceeds 10MB limit"
            exit 1
          fi
          
      - name: Check binary size (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $file = Get-Item starport.exe
          $size = $file.Length
          Write-Host "Binary size: $size bytes"
          if ($size -gt 10485760) {
            Write-Host "Binary size exceeds 10MB limit"
            exit 1
          }

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Gosec Security Scanner
        uses: securego/gosec@master
        with:
          args: '-fmt sarif -out gosec-results.sarif ./...'

      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@v3
        if: always() && github.event_name != 'pull_request'
        with:
          sarif_file: gosec-results.sarif
          
      - name: Upload gosec results as artifact (for PRs)
        uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request'
        with:
          name: gosec-results
          path: gosec-results.sarif
          retention-days: 7

  release-test:
    name: Release Build Test
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION_STABLE }}
          cache: true

      - name: Test release build
        run: |
          make release
          ./starport version
          
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: starport-linux-amd64
          path: starport
          retention-days: 7