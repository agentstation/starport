name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

env:
  GOTOOLCHAIN: go1.27.1

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.1"
          cache: true

      - name: Run golangci-lint
        run: make lint

  test:
    name: Test (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    env:
      CGO_ENABLED: ${{ matrix.cgo }}
      STARPORT_REQUIRE_COMPOSE: ${{ matrix.runner == 'windows-2025' && '1' || '0' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-24.04, cgo: '1', race: '-race'}
          - {runner: ubuntu-24.04-arm, cgo: '1', race: '-race'}
          - {runner: macos-15, cgo: '1', race: '-race'}
          - {runner: windows-2025, cgo: '1', race: '-race'}
          - {runner: windows-11-arm, cgo: '0', race: ''}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.1"
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Test native evidence verifier
        shell: bash
        run: python scripts/test-native-catalog.py

      - name: Record native toolchain
        shell: bash
        run: |
          mkdir -p native-catalog
          go version > native-catalog/toolchain.txt
          go env GOOS GOARCH GOHOSTOS GOHOSTARCH CGO_ENABLED >> native-catalog/toolchain.txt

      - name: Qualify Windows Compose before the native suite
        if: matrix.runner == 'windows-2025'
        shell: bash
        run: go test -json -race -count=1 -timeout 2m ./internal/config -run '^TestComposeStorageRecipes$' > native-catalog/compose.jsonl

      - name: Run native tests
        shell: bash
        run: |
          # Run storage recovery first so publication failures precede full runtime startup.
          # Catalog and application contracts then run alone to bound peak memory.
          go list ./... > native-catalog/packages.txt
          remaining=()
          while IFS= read -r package; do
            case "${package#github.com/agentstation/starport/internal/}" in
              sqlstore|blob|recovery|catalog|app) ;;
              *) remaining+=("$package") ;;
            esac
          done < native-catalog/packages.txt
          coverage=()
          if [[ "${{ matrix.runner }}" == "ubuntu-24.04" ]]; then
            coverage=(-coverprofile=native-catalog/storage.coverage.txt -covermode=atomic)
          fi
          storage=(./internal/sqlstore ./internal/blob)
          if [[ "${{ matrix.runner }}" != "windows-2025" && "${{ matrix.runner }}" != "windows-11-arm" ]]; then
            storage+=(./internal/recovery)
          fi
          # The complete recovery package exceeds Go's default ten-minute
          # package allowance. Individual contract deadlines remain unchanged.
          go test -json -count=1 -timeout 30m ${{ matrix.race }} "${coverage[@]}" "${storage[@]}" | tee native-catalog/tests.jsonl
          coverage=()
          if [[ "${{ matrix.runner }}" == "ubuntu-24.04" ]]; then
            coverage=(-coverprofile=native-catalog/catalog.coverage.txt -covermode=atomic)
          fi
          # The complete catalog package exceeds Go's default ten-minute
          # package allowance. Individual contract deadlines remain unchanged.
          go test -json -count=1 -timeout 30m ${{ matrix.race }} "${coverage[@]}" ./internal/catalog | tee -a native-catalog/tests.jsonl
          coverage=()
          if [[ "${{ matrix.runner }}" == "ubuntu-24.04" ]]; then
            coverage=(-coverprofile=native-catalog/app.coverage.txt -covermode=atomic)
          fi
          # The complete application suite exceeds Go's default ten-minute
          # package allowance. The recovery application layer grew it past
          # thirty minutes on macOS. Individual contract deadlines remain unchanged.
          if [[ "${{ matrix.runner }}" != "windows-2025" ]]; then
            go test -json -count=1 -timeout 60m ${{ matrix.race }} "${coverage[@]}" ./internal/app | tee -a native-catalog/tests.jsonl
          fi
          coverage=()
          if [[ "${{ matrix.runner }}" == "ubuntu-24.04" ]]; then
            coverage=(-coverprofile=native-catalog/remaining.coverage.txt -covermode=atomic)
          fi
          go test -json -count=1 ${{ matrix.race }} "${coverage[@]}" "${remaining[@]}" | tee -a native-catalog/tests.jsonl
          if [[ "${{ matrix.runner }}" == "ubuntu-24.04" ]]; then
            {
              cat native-catalog/storage.coverage.txt
              tail -n +2 native-catalog/catalog.coverage.txt
              tail -n +2 native-catalog/app.coverage.txt
              tail -n +2 native-catalog/remaining.coverage.txt
            } > coverage.txt
          fi

      - name: Measure production destination allocations
        shell: bash
        run: go test -json -count=1 ./internal/credentials -run '^TestDestinationTemplateAuthorizationHasNoAllocations$' | tee native-catalog/allocations.jsonl

      - name: Retain native test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-catalog-${{ matrix.runner }}
          path: native-catalog/
          retention-days: 14
          if-no-files-found: error

      - name: Upload coverage to Codecov
        if: matrix.runner == 'ubuntu-24.04'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.txt
          flags: unittests
          name: codecov-umbrella

  app-test:
    name: App test (windows-2025, ${{ matrix.shard }})
    timeout-minutes: 45
    runs-on: windows-2025
    env:
      CGO_ENABLED: '1'
      STARPORT_TEST_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.1"
          cache: true
      - name: Run complete application shard
        shell: bash
        run: python scripts/app_shards.py run --index ${{ matrix.shard }} --output native-app
      - name: Retain raw application shard evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-catalog-app-windows-2025-${{ matrix.shard }}
          path: native-app/
          retention-days: 14
          if-no-files-found: error

  app-evidence:
    name: Complete Windows application coverage
    timeout-minutes: 10
    env:
      STARPORT_TEST_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    runs-on: ubuntu-24.04
    needs: [app-test]
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test shard and native evidence contracts
        run: |
          python scripts/test-app-shards.py
          python scripts/test-native-catalog.py
      - name: Download this run's native application evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "${{ github.run_id }}" --repo "${{ github.repository }}" --pattern 'native-catalog-app-windows-2025-*' --dir app-evidence
      - name: Verify every discovered owner ran exactly once
        run: python scripts/app_shards.py verify --directory app-evidence

  recovery-test:
    name: Recovery test (${{ matrix.runner }}, ${{ matrix.shard }})
    timeout-minutes: 45
    runs-on: ${{ matrix.runner }}
    env:
      CGO_ENABLED: ${{ matrix.cgo }}
      STARPORT_TEST_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2025, windows-11-arm]
        shard: [0, 1, 2, 3]
        include:
          - {runner: windows-2025, cgo: '1', flags: ''}
          - {runner: windows-11-arm, cgo: '0', flags: '--no-race'}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.1"
          cache: true
      - name: Run complete recovery shard
        shell: bash
        run: python scripts/app_shards.py run --package recovery --index ${{ matrix.shard }} ${{ matrix.flags }} --output native-recovery
      - name: Retain raw recovery shard evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-catalog-recovery-${{ matrix.runner }}-${{ matrix.shard }}
          path: native-recovery/
          retention-days: 14
          if-no-files-found: error

  recovery-evidence:
    name: Complete Windows recovery coverage
    timeout-minutes: 10
    env:
      STARPORT_TEST_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    runs-on: ubuntu-24.04
    needs: [recovery-test]
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test shard and native evidence contracts
        run: |
          python scripts/test-app-shards.py
          python scripts/test-native-catalog.py
      - name: Download this run's native recovery evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "${{ github.run_id }}" --repo "${{ github.repository }}" --pattern 'native-catalog-recovery-*' --dir recovery-evidence
      - name: Verify every discovered recovery owner ran exactly once
        run: |
          python scripts/app_shards.py verify --package recovery --runner windows-2025 --directory recovery-evidence
          python scripts/app_shards.py verify --package recovery --runner windows-11-arm --directory recovery-evidence

  shared-storage:
    name: Shared Storage Startup
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      valkey:
        image: valkey/valkey@sha256:9acdf6f0ae1771ea63c401e127054b2d1779227b9230dcfae37fa684610eaa4f
        ports:
          - 6379/tcp
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
      postgres:
        image: postgres@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: starport_test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres -d starport_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.1"
          cache: true
      - name: Verify shared startup and restart
        env:
          TEST_VALKEY_URL: redis://127.0.0.1:${{ job.services.valkey.ports['6379'] }}
          TEST_POSTGRES_URL: postgres://postgres@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/starport_test?sslmode=disable
        run: go test -json -race -count=1 -timeout 3m ./internal/app -run '^(TestAppWithValkey|TestSharedStartupDoesNotCreateLocalDatabases)$' > shared-startup.jsonl
      - name: Verify durable adapter security and deployment isolation
        env:
          TEST_VALKEY_URL: redis://127.0.0.1:${{ job.services.valkey.ports['6379'] }}
        run: go test -json -race -count=1 -timeout 3m ./internal/storage ./internal/app -run '^Test(ValkeyURLDatabaseSelection|ValkeyConnectionRefusesUnsafeSettings|ValkeyCredentialConflicts|ValkeyTLSIdentity|ValkeyUsernamePassword|ValkeyEffectiveConnectionOptions|ValkeyRequiresDeploymentIdentity|ValkeyDeploymentNamespace|ValkeyDeploymentNotificationIsolation|DeploymentIsolationIncludesGatewayRecords)$' > durable-adapters.jsonl
      - name: Verify authorization source and fleet enforcement
        env:
          TEST_VALKEY_URL: redis://127.0.0.1:${{ job.services.valkey.ports['6379'] }}
          TEST_AUTHORIZATION_POSTGRES_URL: postgres://postgres@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/starport_test?sslmode=disable
        run: go test -json -race -count=1 -timeout 4m ./internal/authorization -run '^(TestRepositorySourceRealStoresAndLocalMutation|TestFleetDurableReceiptPrecedesReplicaEnforcement)$' > authorization-storage.jsonl
      - name: Verify dedicated response cache
        env:
          TEST_SHARED_CACHE_URL: redis://127.0.0.1:${{ job.services.valkey.ports['6379'] }}
        run: go test -json -race -count=1 -timeout 2m ./internal/cache ./internal/app -run '^TestSharedCache' > shared-cache.jsonl
      - name: Retain shared startup evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: shared-storage-startup
          path: |
            shared-startup.jsonl
            durable-adapters.jsonl
            authorization-storage.jsonl
            shared-cache.jsonl
          retention-days: 7

  catalog-fleet:
    name: Catalog Fleet Recovery
    runs-on: ubuntu-latest
    # Includes cold compilation, bounded recovery groups, and evidence upload.
    timeout-minutes: 30
    services:
      valkey:
        image: valkey/valkey@sha256:9acdf6f0ae1771ea63c401e127054b2d1779227b9230dcfae37fa684610eaa4f
        ports:
          - 6379/tcp
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
      valkey-replacement:
        image: valkey/valkey@sha256:9acdf6f0ae1771ea63c401e127054b2d1779227b9230dcfae37fa684610eaa4f
        ports:
          - 6379/tcp
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
      valkey-fresh:
        image: valkey/valkey@sha256:9acdf6f0ae1771ea63c401e127054b2d1779227b9230dcfae37fa684610eaa4f
        ports:
          - 6379/tcp
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
      postgres:
        image: postgres@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: starport_test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres -d starport_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.1"
          cache: true
      - name: Verify native catalog publication and recovery
        env:
          TEST_VALKEY_URL: redis://127.0.0.1:${{ job.services.valkey.ports['6379'] }}
          TEST_VALKEY_REPLACEMENT_URL: redis://127.0.0.1:${{ job.services.valkey-replacement.ports['6379'] }}
          TEST_POSTGRES_URL: postgres://postgres@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/starport_test?sslmode=disable
        run: go test -json -race -count=1 -timeout 7m ./internal/catalog ./internal/recovery ./internal/storage -run '^(TestFleet|TestFreshFleet|TestRecoveryWitness|TestBudgetAuthority|TestValkeyIncarnation)' -skip '^TestFleetAdoption' > fleet-catalog.jsonl
      - name: Verify controlled catalog adoption
        env:
          TEST_VALKEY_URL: redis://127.0.0.1:${{ job.services.valkey.ports['6379'] }}
          TEST_VALKEY_REPLACEMENT_URL: redis://127.0.0.1:${{ job.services.valkey-replacement.ports['6379'] }}
          TEST_POSTGRES_URL: postgres://postgres@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/starport_test?sslmode=disable
        run: go test -json -race -count=1 -timeout 7m ./internal/catalog -run '^TestFleetAdoption' > fleet-adoption.jsonl
      - name: Verify explicit fleet initialization and startup
        env:
          TEST_FRESH_VALKEY_URL: redis://127.0.0.1:${{ job.services.valkey-fresh.ports['6379'] }}
          TEST_POSTGRES_URL: postgres://postgres@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/starport_test?sslmode=disable
        run: go test -json -race -count=1 -timeout 3m ./internal/app -run '^TestInitializeFleet' > fleet-initialization.jsonl
      - name: Verify budget admission across processes and backend replacement
        env:
          TEST_VALKEY_URL: redis://127.0.0.1:${{ job.services.valkey.ports['6379'] }}
          TEST_VALKEY_REPLACEMENT_URL: redis://127.0.0.1:${{ job.services.valkey-replacement.ports['6379'] }}
          TEST_POSTGRES_URL: postgres://postgres@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/starport_test?sslmode=disable
        run: |
          # Each scenario starts full gateway processes with the complete catalog.
          # Isolate parent lifetimes and keep a separate bound for each scenario.
          for scenario in concurrent-settlement dispatched-process-loss backend-replacement; do
            go test -json -race -count=1 -timeout 7m ./internal/app \
              -run "^TestProductionBudgetAcrossProcesses$/${scenario}$" >> fleet-budget.jsonl
          done
          go test -json -race -count=1 -timeout 7m ./internal/app \
            -run '^(TestSettledJobRequiresOriginalSharedApproval|TestProductionBudgetBackendOperations)$' >> fleet-budget.jsonl
      - name: Retain catalog fleet evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: catalog-fleet-recovery
          path: |
            fleet-catalog.jsonl
            fleet-adoption.jsonl
            fleet-initialization.jsonl
            fleet-budget.jsonl
          retention-days: 7
          if-no-files-found: error

  durable-work-recovery:
    name: Durable Work Recovery
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      valkey:
        image: valkey/valkey@sha256:9acdf6f0ae1771ea63c401e127054b2d1779227b9230dcfae37fa684610eaa4f
        ports:
          - 6379/tcp
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
      valkey-replacement:
        image: valkey/valkey@sha256:9acdf6f0ae1771ea63c401e127054b2d1779227b9230dcfae37fa684610eaa4f
        ports:
          - 6379/tcp
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
      postgres:
        image: postgres@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: starport_test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres -d starport_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
      mysql:
        image: mysql@sha256:3466ba4a4828aa8d46fb7c3bc16b67b781c98413cf4ea0fac6feaa6e881faa26
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_ROOT_HOST: '%'
          MYSQL_DATABASE: starport_test
        ports:
          - 3306/tcp
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.1"
          cache: true
      - name: Build the pinned recovery object store
        # Official RELEASE.2025-09-07T16-13-09Z source. Public images are unavailable.
        env:
          GOBIN: ${{ runner.temp }}/recovery-objectstore-bin
          GOSUMDB: sum.golang.org
        run: |
          go install github.com/minio/minio@v0.0.0-20250907161309-07c3a429bfed
          go version -m "$GOBIN/minio" > recovery-objectstore-build.txt
      - name: Verify durable work and complete backup storage
        shell: bash
        env:
          TEST_VALKEY_URL: redis://127.0.0.1:${{ job.services.valkey.ports['6379'] }}
          TEST_UNPREFIXED_VALKEY_URL: redis://127.0.0.1:${{ job.services.valkey.ports['6379'] }}/13
          TEST_VALKEY_REPLACEMENT_URL: redis://127.0.0.1:${{ job.services.valkey-replacement.ports['6379'] }}
          TEST_POSTGRES_URL: postgres://postgres@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/starport_test?sslmode=disable
          TEST_MYSQL_DSN: root@tcp(127.0.0.1:${{ job.services.mysql.ports['3306'] }})/starport_test?parseTime=true
          TEST_BLOB_S3_ENDPOINT: http://127.0.0.1:9000
          MINIO_ROOT_USER: starport-test
          MINIO_ROOT_PASSWORD: starport-local-test-only
          MINIO_BROWSER: 'off'
        run: |
          "$RUNNER_TEMP/recovery-objectstore-bin/minio" server "$RUNNER_TEMP/recovery-objectstore-data" \
            --address 127.0.0.1:9000 > recovery-objectstore.log 2>&1 &
          objectstore_pid=$!
          trap 'kill "$objectstore_pid" 2>/dev/null || true; wait "$objectstore_pid" 2>/dev/null || true' EXIT
          curl --fail --silent --show-error --retry 15 --retry-connrefused \
            --retry-delay 1 --max-time 3 "$TEST_BLOB_S3_ENDPOINT/minio/health/live"
          go test -json -race -count=1 -timeout 5m ./internal/limits/reservation ./internal/jobs > fleet-reservation-jobs.jsonl
          # Separate the full runtime from transfer adapters to bound peak memory.
          go test -json -race -count=1 -p 1 -timeout 10m \
            ./internal/storage ./internal/sqlstore ./internal/blob ./internal/recovery > backup-storage.jsonl
          go test -json -race -count=1 -timeout 7m ./internal/catalog \
            -run '^TestCapturedFleetCatalogNativeReferences$' > backup-catalog.jsonl
          go test -json -race -count=1 -timeout 5m ./internal/app \
            -run '^(TestRestoreApplicationSharedRecipe|TestRestorePublishFilesSharedRecipe|TestUnprefixedBackupRequiresValkeyBeforeOpeningStores|TestUnprefixedBackupMigratesVerifiedRecordsUnderBarriers)$' > backup-application.jsonl
          python scripts/recovery_application.py verify-legacy --results backup-application.jsonl
      - name: Retain durable work evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: durable-work-recovery
          path: |
            fleet-reservation-jobs.jsonl
            backup-storage.jsonl
            backup-catalog.jsonl
            backup-application.jsonl
            recovery-objectstore-build.txt
            recovery-objectstore.log
          retention-days: 7
          if-no-files-found: error

  application-recovery:
    name: Application Recovery (${{ matrix.group }}, ${{ matrix.mode }})
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      CGO_ENABLED: ${{ matrix.mode == 'race' && '1' || '0' }}
      GOWORK: 'off'
      STARPORT_TEST_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        group: [activation, gateway, operator, namespace, full-embedded]
        mode: [pure, race]
    services:
      valkey:
        image: valkey/valkey@sha256:9acdf6f0ae1771ea63c401e127054b2d1779227b9230dcfae37fa684610eaa4f
        ports:
          - 6379/tcp
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
      valkey-replacement:
        image: valkey/valkey@sha256:9acdf6f0ae1771ea63c401e127054b2d1779227b9230dcfae37fa684610eaa4f
        ports:
          - 6379/tcp
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
      postgres:
        image: postgres@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: starport_test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres -d starport_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
      mysql:
        image: mysql@sha256:3466ba4a4828aa8d46fb7c3bc16b67b781c98413cf4ea0fac6feaa6e881faa26
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_ROOT_HOST: '%'
          MYSQL_DATABASE: starport_test
        ports:
          - 3306/tcp
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.1"
          cache: true
      - name: Test required application recovery evidence
        run: python scripts/test-recovery-application.py
      - name: Build the pinned recovery object store
        env:
          GOBIN: ${{ runner.temp }}/recovery-objectstore-bin
          GOSUMDB: sum.golang.org
        run: |
          go install github.com/minio/minio@v0.0.0-20250907161309-07c3a429bfed
          go version -m "$GOBIN/minio" > "$RUNNER_TEMP/recovery-objectstore-build.txt"
      - name: Qualify named application recovery against native owners
        shell: bash
        env:
          TEST_VALKEY_URL: redis://127.0.0.1:${{ job.services.valkey.ports['6379'] }}
          TEST_UNPREFIXED_VALKEY_URL: redis://127.0.0.1:${{ job.services.valkey.ports['6379'] }}/13
          TEST_VALKEY_REPLACEMENT_URL: redis://127.0.0.1:${{ job.services.valkey-replacement.ports['6379'] }}
          TEST_POSTGRES_URL: postgres://postgres@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/starport_test?sslmode=disable
          TEST_MYSQL_DSN: root@tcp(127.0.0.1:${{ job.services.mysql.ports['3306'] }})/starport_test?parseTime=true
          TEST_BLOB_S3_ENDPOINT: http://127.0.0.1:9000
          MINIO_ROOT_USER: starport-test
          MINIO_ROOT_PASSWORD: starport-local-test-only
          MINIO_BROWSER: 'off'
        run: |
          "$RUNNER_TEMP/recovery-objectstore-bin/minio" server "$RUNNER_TEMP/recovery-objectstore-data" \
            --address 127.0.0.1:9000 > "$RUNNER_TEMP/recovery-objectstore.log" 2>&1 &
          objectstore_pid=$!
          trap 'kill "$objectstore_pid" 2>/dev/null || true; wait "$objectstore_pid" 2>/dev/null || true' EXIT
          curl --fail --silent --show-error --retry 15 --retry-connrefused \
            --retry-delay 1 --max-time 3 "$TEST_BLOB_S3_ENDPOINT/minio/health/live"
          # Groups have separate services. Tests run serially within each group.
          # The Go process cap preserves the existing application suite allowance.
          # Product operation deadlines remain in the named tests.
          python scripts/recovery_application.py run --group ${{ matrix.group }} --mode ${{ matrix.mode }} \
            --output "$RUNNER_TEMP/application-recovery"
      - name: Retain original application recovery evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: application-recovery-${{ matrix.group }}-${{ matrix.mode }}
          path: ${{ runner.temp }}/application-recovery/
          retention-days: 14
          if-no-files-found: error
      - name: Retain native object storage evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: application-objectstore-${{ matrix.group }}-${{ matrix.mode }}
          path: |
            ${{ runner.temp }}/recovery-objectstore-build.txt
            ${{ runner.temp }}/recovery-objectstore.log
          retention-days: 14
          if-no-files-found: error

  application-recovery-evidence:
    name: Complete Application Recovery
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [application-recovery]
    permissions:
      contents: read
      actions: read
    env:
      STARPORT_TEST_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Require every application recovery group
        env:
          APPLICATION_RECOVERY_RESULT: ${{ needs.application-recovery.result }}
        run: test "$APPLICATION_RECOVERY_RESULT" = success
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test required application recovery evidence
        run: python scripts/test-recovery-application.py
      - name: Download original application recovery evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "${{ github.run_id }}" --repo "${{ github.repository }}" --pattern 'application-recovery-*' --dir application-recovery-evidence
      - name: Require every named owner and subcase in both native modes
        run: python scripts/recovery_application.py verify --directory application-recovery-evidence

  authorization-capacity:
    name: Authorization Capacity
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.1"
          cache: true
      - name: Measure authorization capacity
        run: make --silent test-authorization-capacity > authorization-capacity.jsonl
      - name: Verify bounded catalog capacity
        run: make --silent test-catalog-capacity
      - name: Retain capacity evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: authorization-capacity
          path: |
            authorization-capacity.jsonl
            catalog-capacity/
          retention-days: 7
          if-no-files-found: error

  storage-recipes:
    name: Storage Recipes
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.1"
          cache: true
      - name: Set up container builder
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build recipe image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: starport-storage-recipe:ci
          cache-from: type=gha,scope=storage-recipe
          cache-to: type=gha,mode=max,scope=storage-recipe
      - name: Verify complete recipes and local restore
        env:
          STARPORT_RECIPE_IMAGE: starport-storage-recipe:ci
        run: go test -json -race -count=1 -timeout 5m ./internal/config -run '^Test(ComposeStorageRecipes|ContainerRecipePersistence)$' > storage-recipes.jsonl
      - name: Retain recipe evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: storage-recipes
          path: storage-recipes.jsonl
          if-no-files-found: error
          retention-days: 7

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test, app-test, app-evidence, recovery-test, recovery-evidence, shared-storage, catalog-fleet, durable-work-recovery, application-recovery-evidence, authorization-capacity, storage-recipes, release-contract, sdk-smoke]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.1"
          cache: true

      - name: Check console workspace
        run: |
          npm install -g pnpm@11.22.0
          pnpm -C console install --frozen-lockfile
          pnpm -C console check

      - name: Build binary
        run: make build

      - name: Test binary
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            ./starport.exe --version
            ./starport.exe help
          else
            ./starport --version
            ./starport help
          fi

      - name: Build release binary
        run: make release

      - name: Report release binary size
        run: |
          ls -lh starport
          size=$(stat -c%s starport 2>/dev/null || stat -f%z starport)
          echo "Binary size: $size bytes"

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.1"
          cache: true

      - name: Run Gosec Security Scanner
        run: go run github.com/securego/gosec/v2/cmd/gosec@v2.29.0 -fmt sarif -out gosec-results.sarif ./...

      - name: Upload gosec results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: gosec-results
          path: gosec-results.sarif
          retention-days: 7

  release-contract:
    name: Release Contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.1"
          cache: true

      - name: Resolve verified published Starmap source
        id: starmap
        shell: bash
        run: |
          VERSION=$(go list -m -f '{{.Version}}' github.com/agentstation/starmap)
          MODULE=$(go mod download -json "github.com/agentstation/starmap@$VERSION")
          test "$(jq -r .Version <<<"$MODULE")" = "$VERSION"
          ROOT=$(jq -r .Dir <<<"$MODULE")
          test -d "$ROOT/pkg/catalogs"
          printf 'root=%s\n' "$ROOT" >> "$GITHUB_OUTPUT"

      - name: Verify release contracts
        env:
          STARMAP_OWNERSHIP_STARMAP_ROOT: ${{ steps.starmap.outputs.root }}
          CATALOG_DRIVEN_STARMAP_ROOT: ${{ steps.starmap.outputs.root }}
        run: |
          bash scripts/verify-starmap-ownership.sh
          bash scripts/verify-v1-architecture.sh
          bash scripts/test-dependency-direction-verifier.sh
          bash scripts/verify-dependency-direction.sh
          bash scripts/verify-catalog-driven-providers.sh
          bash scripts/verify-package-layout.sh
          bash scripts/verify-readme-quickstart.sh
          bash scripts/verify-v1-release.sh
          bash scripts/verify-release-workflow.sh
          bash scripts/verify-developer-experience.sh
          bash scripts/verify-doc-links.sh
          bash scripts/test-doc-link-verifier.sh
          bash scripts/verify-openrouter-parity.sh
          bash scripts/verify-console-modernization.sh
          bash scripts/verify-auth-onboarding.sh
          bash scripts/verify-console-session-grants.sh
          bash scripts/verify-model-modalities.sh
          bash scripts/verify-files-api.sh
          bash scripts/verify-async-media-jobs.sh
          bash scripts/verify-document-parser.sh
          bash scripts/verify-reranking.sh
          bash scripts/verify-catalog-performance.sh
          bash scripts/verify-credential-sharing.sh
          bash scripts/verify-enterprise-readiness.sh
          bash scripts/verify-console-polish.sh
          bash scripts/benchmark-overhead.sh
          bash scripts/smoke-first-run.sh

      - name: Check GoReleaser configuration
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.17.1
          args: check

  sdk-smoke:
    name: OpenRouter SDK Compatibility
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.1"
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Test all official OpenRouter SDKs
        run: bash scripts/smoke-openrouter-sdks.sh

  release-snapshot:
    name: Release Snapshot
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.1"
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Install the console package manager
        run: npm install -g pnpm@11.22.0

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          syft-version: v1.51.0

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@e99025eb970cfa124b8284a35463d87426917478 # 2026.09.28.1

      - name: Build release snapshot
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.17.1
          args: release --snapshot --clean --skip=notarize

      - name: Verify release snapshot
        run: |
          scripts/verify-release-binaries.sh dist
          scripts/verify-release-archives.sh dist
          scripts/verify-homebrew-cask.sh dist/homebrew/Casks/starport.rb
          scripts/audit-homebrew-cask.sh dist/homebrew/Casks/starport.rb

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: starport-release-snapshot
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
            dist/homebrew/Casks/starport.rb
          retention-days: 7

  action-pins:
    name: Action Pin Provenance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify action pins
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/verify-action-pins.sh
