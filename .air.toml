root = "."
testdata_dir = "testdata"
tmp_dir = "tmp"

[build]
  # Build configuration
  cmd = "go build -o ./tmp/starport ./cmd/starport"
  bin = "./tmp/starport serve"
  
  # Watch all relevant file types
  include_ext = ["go", "tpl", "tmpl", "html", "css", "js", "yaml", "json"]
  include_dir = ["cmd", "internal", "pkg"]
  
  # Exclude non-source directories
  exclude_dir = ["tmp", "vendor", "testdata", "docs", "scripts", ".git", "storage/data", "coverage.out", "*.test"]
  exclude_regex = ["_test\\.go"]
  
  # Performance settings
  delay = 500  # Faster feedback
  kill_delay = "2s"  # Graceful shutdown
  
  # Behavior
  send_interrupt = true  # Send interrupt for graceful shutdown
  stop_on_error = false  # Keep running on errors
  log = "build-errors.log"
  
  # File watching
  exclude_unchanged = false
  follow_symlink = false
  poll = false
  poll_interval = 0

[color]
  app = ""
  build = "yellow"
  main = "magenta"
  runner = "green"
  watcher = "cyan"

[log]
  main_only = false
  time = true  # Show timestamps

[misc]
  clean_on_exit = true  # Clean tmp files on exit

[screen]
  clear_on_rebuild = true  # Clear screen for better visibility
  keep_scroll = true