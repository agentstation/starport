<!DOCTYPE html>
<html lang="en" data-theme="{{.Theme}}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="gpc-enabled" content="false">
    <title>{{.Title}}</title>
    <link rel="stylesheet" href="/chat/static/chat.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💬</text></svg>">
</head>
<body>
    <div id="app">
        <!-- Fixed overlay elements stay outside the layout -->
        <div class="drawer-toggle-group">
            <button id="drawer-toggle" class="btn-icon" title="Toggle Sidebar" aria-label="Toggle Sidebar" aria-expanded="false">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect width="18" height="18" x="3" y="3" rx="2"></rect>
                    <path d="M9 3v18"></path>
                </svg>
            </button>
            <button id="search-btn" class="btn-icon search-btn" title="Search (Ctrl+K)" aria-label="Search chats">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="8"></circle>
                    <path d="m21 21-4.3-4.3"></path>
                </svg>
            </button>
            <button id="plus-btn" class="btn-icon plus-btn" title="New Chat" aria-label="Create new chat">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="12" y1="5" x2="12" y2="19"></line>
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                </svg>
            </button>
        </div>

        <!-- Backdrop for mobile -->
        <div class="sidebar-backdrop mobile-only" id="sidebar-backdrop"></div>

        <!-- Main layout container using CSS Grid -->
        <div class="layout-container">
            <!-- Sidebar -->
            <aside class="sidebar" id="sidebar" role="navigation">
                <div class="sidebar-title-section">
                    <h1 class="sidebar-title">{{.Title}}</h1>
                </div>
                <div class="sidebar-content">
                    <div class="sidebar-header">
                        <button id="new-chat" class="btn btn-primary">
                            New Chat
                        </button>
                        <div class="sidebar-search">
                            <input type="text" id="sidebar-search-input" class="sidebar-search-input" placeholder="Search chats..." autocomplete="off">
                            <svg class="sidebar-search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="11" cy="11" r="8"></circle>
                                <path d="m21 21-4.3-4.3"></path>
                            </svg>
                        </div>
                    </div>
                    <div class="chat-list" id="chat-list" role="list" aria-label="Chat history">
                        <!-- Chat history will be populated here -->
                    </div>
                    <div class="sidebar-footer">
                        <button id="clear-all" class="btn btn-danger">
                            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <polyline points="3 6 5 6 21 6"></polyline>
                                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                                <line x1="10" y1="11" x2="10" y2="17"></line>
                                <line x1="14" y1="11" x2="14" y2="17"></line>
                            </svg>
                            Clear All Chats
                        </button>
                    </div>
                </div>
            </aside>

            <!-- Content wrapper for header + main -->
            <div class="content-wrapper">
                <!-- Header -->
                <header class="header">
                    <div class="header-content">
                        <div class="header-model-section">
                            <div class="model-dropdown-wrapper">
                                <button id="model-select-button" class="model-select-button" aria-haspopup="menu" aria-expanded="false" data-state="closed">
                                    <div class="model-select-display">
                                        <div class="model-select-name">Loading models...</div>
                                    </div>
                                    <svg class="model-select-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <path d="m6 9 6 6 6-6"></path>
                                    </svg>
                                </button>
                                <div id="model-dropdown" class="model-dropdown hidden">
                                    <div class="model-dropdown-header">
                                        <div class="model-search-wrapper">
                                            <svg class="model-search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                                <circle cx="11" cy="11" r="8"></circle>
                                                <path d="m21 21-4.3-4.3"></path>
                                            </svg>
                                            <input type="text" id="model-search-input" class="model-search-input" placeholder="Search models..." autocomplete="off">
                                        </div>
                                    </div>
                                    <div class="model-dropdown-content" id="model-dropdown-content">
                                        <!-- Model list will be populated here -->
                                    </div>
                                    <div class="model-dropdown-footer">
                                        <button id="show-all-models" class="btn-text">
                                            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                                <polyline points="6 9 12 15 18 9"></polyline>
                                            </svg>
                                            <span>Show all</span>
                                        </button>
                                        <button id="filter-models" class="btn-icon btn-small" title="Filter models">
                                            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                                <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon>
                                            </svg>
                                        </button>
                                    </div>
                                </div>
                            </div>
                            <div id="model-pricing" class="model-pricing"></div>
                        </div>
                        <div class="header-actions">
                            <a href="https://github.com/agentstation/starport" target="_blank" rel="noopener noreferrer" class="btn-icon" title="View on GitHub" aria-label="View on GitHub">
                                <svg class="icon" viewBox="0 0 24 24" fill="currentColor">
                                    <path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/>
                                </svg>
                            </a>
                            <button id="settings-btn" class="btn-icon" title="Settings" aria-label="Open settings">
                                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"></path>
                                    <circle cx="12" cy="12" r="3"></circle>
                                </svg>
                            </button>
                            <button id="theme-toggle" class="btn-icon" title="Toggle theme" aria-label="Toggle theme">
                                <svg class="icon icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <circle cx="12" cy="12" r="5"></circle>
                                    <line x1="12" y1="1" x2="12" y2="3"></line>
                                    <line x1="12" y1="21" x2="12" y2="23"></line>
                                    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                                    <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                                    <line x1="1" y1="12" x2="3" y2="12"></line>
                                    <line x1="21" y1="12" x2="23" y2="12"></line>
                                    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                                    <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                                </svg>
                                <svg class="icon icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                                </svg>
                            </button>
                        </div>
                        </div>
                </header>

                <!-- Main Layout -->
                <div class="main-layout">
                    <!-- Chat Container -->
                    <main class="chat-container">

                        <div class="messages" id="messages" data-gramm="false">
                            <div class="messages-container">
                                <div class="welcome-message">
                                    <h2>Welcome to {{.Title}}</h2>
                                    <p>To get started:</p>
                                    <ol>
                                        <li>Click the settings icon (⚙️) in the header</li>
                                        <li>Enter your API key</li>
                                        <li>Select a model from the dropdown</li>
                                        <li>Start chatting!</li>
                                    </ol>
                                </div>
                            </div>
                        </div>

                        <div class="input-container">
                            <div class="input-container-inner">
                                <div class="input-wrapper">
                                    <textarea 
                                        id="message-input" 
                                        class="message-input" 
                                        placeholder="Type your message..."
                                        rows="1"
                                        data-gramm="false"
                                    ></textarea>
                                    <button id="send-btn" class="btn btn-primary send-btn" disabled>
                                        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                            <line x1="22" y1="2" x2="11" y2="13"></line>
                                            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                                        </svg>
                                    </button>
                                    <button id="stop-btn" class="btn btn-danger send-btn hidden">
                                        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                            <rect x="6" y="6" width="12" height="12"></rect>
                                        </svg>
                                    </button>
                                </div>
                                <div class="input-info">
                                    <span id="token-count">Tokens: 0</span>
                                    <span class="attribution">
                                        made by <a href="https://agentstation.ai" target="_blank" rel="noopener noreferrer">agentstation.ai</a> with <span class="heart">❤️</span>
                                    </span>
                                    <span id="cost-estimate">Cost: $0.00</span>
                                </div>
                            </div>
                        </div>
                    </main>
                </div>
            </div>
        </div>

        <!-- Settings Modal -->
        <div id="settings-modal" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>Settings</h2>
                    <button class="btn-icon modal-close" aria-label="Close settings">
                        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="18" y1="6" x2="6" y2="18"></line>
                            <line x1="6" y1="6" x2="18" y2="18"></line>
                        </svg>
                    </button>
                </div>
                <div class="modal-body">
                    <form autocomplete="off">
                        <div class="form-group">
                            <label for="api-key">API Key</label>
                            <div class="input-group">
                                <input type="password" id="api-key" class="form-input" placeholder="sk-..." autocomplete="off">
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="api-base">API Base URL</label>
                            <input type="text" id="api-base" class="form-input" value="{{.APIBaseURL}}" readonly>
                        </div>
                        <div class="form-group">
                            <label>
                                <input type="checkbox" id="stream-enabled" checked>
                                Enable streaming responses
                            </label>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-primary modal-close">Close</button>
                </div>
            </div>
        </div>

        <!-- Search Modal -->
        <div id="search-modal" class="modal search-modal">
            <div class="search-modal-content">
                <div class="search-header">
                    <input type="text" id="search-input" class="search-input" placeholder="Search chats..." autocomplete="off">
                    <button class="btn-icon search-close" aria-label="Close search">
                        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="18" y1="6" x2="6" y2="18"></line>
                            <line x1="6" y1="6" x2="18" y2="18"></line>
                        </svg>
                    </button>
                </div>
                <div class="search-results" id="search-results">
                    <!-- Search results will be populated here -->
                </div>
            </div>
        </div>

        <!-- Model Selector Expanded Modal -->
        <div id="model-expanded-modal" class="modal model-expanded-modal">
            <div class="model-expanded-content">
                <div class="model-expanded-header">
                    <div class="model-expanded-search-wrapper">
                        <svg class="model-search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="11" cy="11" r="8"></circle>
                            <path d="m21 21-4.3-4.3"></path>
                        </svg>
                        <input type="text" id="model-expanded-search" class="model-expanded-search" placeholder="Search models..." autocomplete="off">
                    </div>
                    <button class="btn-icon model-expanded-close" aria-label="Close model selector">
                        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="18" y1="6" x2="6" y2="18"></line>
                            <line x1="6" y1="6" x2="18" y2="18"></line>
                        </svg>
                    </button>
                </div>
                <div class="model-expanded-body" id="model-expanded-body">
                    <!-- Model grid will be populated here -->
                </div>
                <div class="model-expanded-footer">
                    <button id="expanded-favorites-toggle" class="btn-text">
                        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="m15 18-6-6 6-6"></path>
                        </svg>
                        <span>Favorites</span>
                        <div class="favorites-indicator"></div>
                    </button>
                    <button id="expanded-filter-btn" class="btn-icon btn-small" title="Filter models">
                        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon>
                        </svg>
                    </button>
                </div>
            </div>
        </div>

        <!-- Error Toast -->
        <div id="error-toast" class="toast toast-error hidden">
            <div class="toast-content">
                <span class="toast-message"></span>
                <button class="btn-icon toast-close" aria-label="Close notification">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>
            <div class="toast-details hidden">
                <pre class="error-json"></pre>
            </div>
        </div>
    </div>

    <script>
        // Pass configuration to JavaScript
        window.STARPORT_CONFIG = {
            apiBaseURL: "{{.APIBaseURL}}"
        };
    </script>
    <!-- Markdown parsing and XSS protection libraries -->
    <script src="https://cdn.jsdelivr.net/npm/marked@11.1.1/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.8/dist/purify.min.js"></script>
    <!-- Syntax highlighting with Prism.js -->
    <link id="prism-theme" rel="stylesheet" href="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/themes/{{if eq .Theme "dark"}}prism-tomorrow{{else}}prism{{end}}.min.css">
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/prism.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/plugins/autoloader/prism-autoloader.min.js"></script>
    <!-- Math rendering with KaTeX -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" integrity="sha384-n8MVd4RsNIU0tAv4ct0nTaAbDJwPJzDEaqSD1odI+WdtXRGWt2kTvGFasHpSy3SV" crossorigin="anonymous">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js" integrity="sha384-XjKyOOlGwcjNTAIQHIpgOno0Hl1YQqzUOEleOLALmuqehneUG+vnGctmUb0ZY0l8" crossorigin="anonymous"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js" integrity="sha384-+VBxd3r6XgURycqtZ117nYw44OOcIax56Z4dCRWbxyPt0Koah1uHoK0o4+/RRE05" crossorigin="anonymous"></script>
    <!-- Diagram rendering with Mermaid.js -->
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10.6.1/dist/mermaid.min.js"></script>
    <script src="/chat/static/chat.js"></script>
</body>
</html>
