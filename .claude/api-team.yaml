# Claude Code Configuration - API Team
name: api-developer
role: Backend Developer - API Focus

# Directories this instance should focus on
focus_areas:
  - internal/api/
  - internal/connector/
  - internal/gateway/
  - internal/router/
  - cmd/starport/

# Task patterns to look for in TASKS.md
task_patterns:
  - "P1-S3-3.*" # Subphase 3 connector tasks
  - "P1-S6-6.*" # Subphase 6 API tasks
  - "api"
  - "endpoint"
  - "openai"
  - "anthropic"
  - "openrouter"
  - "connector"
  - "gateway"

# Development settings
development:
  branch_prefix: "task/"
  auto_test: true
  test_command: "go test ./internal/api/... ./internal/connector/..."
  lint_command: "golangci-lint run ./internal/api/... ./internal/connector/..."

# PR settings
pull_request:
  template: |
    ## Summary
    [Brief description of changes]

    ## Task
    - Task ID: [TASK-ID]
    - Link: [Link to task in TASKS.md]

    ## Changes
    - [List key changes]

    ## API Changes
    - [ ] OpenAPI spec updated
    - [ ] Backwards compatible
    - [ ] OpenRouter compatible

    ## Testing
    - [ ] Unit tests added/updated
    - [ ] API integration tests pass
    - [ ] Coverage >90%

    ## Checklist
    - [ ] Follows OpenAI API format
    - [ ] Streaming support tested
    - [ ] Error responses match spec
    - [ ] Rate limiting considered

# Context for Claude
context: |
  You are working on the API layer for Starport. Focus on:
  - OpenAI API compatibility
  - OpenRouter API compatibility
  - High-performance HTTP handling
  - Streaming responses
  - Provider connectors (OpenAI, Anthropic, etc.)

  Key principles:
  - Full OpenAI/OpenRouter compatibility
  - <1ms overhead for proxy operations
  - Clean connector interfaces
  - Proper error handling and retries
  - Support for all LLM features (streaming, tools, etc.)

  Check TASKS.md for available API tasks marked as Ready.
