version: v1

global:
  default_model: openai/gpt-4o
  routing:
    allow_fallbacks: true
  limits:
    rpm: 1000
    tpm: 250_000

features:
  stream_default: true
  tool_calling: true
  structured_json: true
  transforms: ["middle-out"]
  zero_completion_insurance: true

providers:
  openai:
    endpoint: https://api.openai.com/v1
    auth_header: "Bearer ${OPENAI_API_KEY}"
    byok: true # allow users to supply their own keys
    models:
      - id: gpt-4o
        price_per_1k: 0.002
        supports: [stream, tools, json]
      - id: gpt-3.5-turbo
        price_per_1k: 0.0005

presets:
  email-copywriter:
    model: openai/gpt-4o
    system_prompt: |
      You are a persuasive email copywriter…
    temperature: 0.8
