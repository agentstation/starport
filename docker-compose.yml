# Fresh single-process deployment. See docs/OPERATOR-GUIDE.md for upgrades.
services:
  starport:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - path: .env
        required: false
    ports:
      - "127.0.0.1:${STARPORT_PORT:-8080}:8080"
    volumes:
      - starport-config:/var/lib/starport/config
      - starport-data:/var/lib/starport/data
      - starport-state:/var/lib/starport/state
    # The root file system is read-only. Scratch and the rebuildable source cache use tmpfs.
    read_only: true
    tmpfs:
      - /tmp
      - /var/lib/starport/cache:uid=65532,gid=65532,mode=0700
    environment:
      STARPORT_SERVER_HOST: 0.0.0.0
      STARPORT_STORAGE_MODE: badger
      STARPORT_STORAGE_BADGER_SYNC_WRITES: "true"
      STARPORT_STORAGE_SQL_MODE: sqlite
      STARPORT_FILES_BACKEND: filesystem
      STARPORT_SECURITY_MASTER_KEY: ${STARPORT_SECURITY_MASTER_KEY:?set STARPORT_SECURITY_MASTER_KEY}
    restart: unless-stopped

volumes:
  starport-config:
  starport-data:
  starport-state:
