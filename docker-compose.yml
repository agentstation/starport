services:
  valkey:
    image: valkey/valkey:7-alpine
    command: valkey-server --appendonly yes
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  starport:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - path: .env
        required: false
    ports:
      - "8080:8080"
    volumes:
      - starport-config:/var/lib/starport/config
      - starport-data:/var/lib/starport/data
    environment:
      STARPORT_SERVER_HOST: 0.0.0.0
      STARPORT_STORAGE_MODE: valkey
      STARPORT_STORAGE_VALKEY_URL: valkey://valkey:6379
      STARPORT_CATALOG_STATE_DIR: /var/lib/starport/data/catalog
      STARPORT_SECURITY_MASTER_KEY: ${STARPORT_SECURITY_MASTER_KEY:?set STARPORT_SECURITY_MASTER_KEY}
    depends_on:
      valkey:
        condition: service_healthy
    restart: unless-stopped

volumes:
  valkey-data:
  starport-config:
  starport-data:
