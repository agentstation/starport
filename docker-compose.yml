services:
  valkey:
    image: valkey/valkey:7-alpine
    command: valkey-server --appendonly yes
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  starport:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      STARPORT_STORAGE_MODE: valkey
      STARPORT_STORAGE_VALKEY_URL: valkey://valkey:6379
      STARPORT_SECURITY_MASTER_KEY: ${STARPORT_SECURITY_MASTER_KEY:?set STARPORT_SECURITY_MASTER_KEY}
      STARPORT_SECURITY_BOOTSTRAP_API_KEY: ${STARPORT_SECURITY_BOOTSTRAP_API_KEY:?set STARPORT_SECURITY_BOOTSTRAP_API_KEY}
      STARPORT_PROVIDERS_OPENAI_API_KEY: ${STARPORT_PROVIDERS_OPENAI_API_KEY:?set STARPORT_PROVIDERS_OPENAI_API_KEY}
    depends_on:
      valkey:
        condition: service_healthy
    restart: unless-stopped

volumes:
  valkey-data:
