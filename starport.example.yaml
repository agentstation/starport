version: v1

# ─── Global defaults ──────────────────────────────────────────────
global:
  default_model: openai/gpt-4o
  allow_fallbacks: true # align with OpenRouter `models` fallback logic  [oai_citation:0‡OpenRouter](https://openrouter.ai/docs/features/model-routing)
  routing:
    order: price # choose "price" or "throughput" like OpenRouter provider sorting  [oai_citation:1‡OpenRouter](https://openrouter.ai/docs/features/provider-routing)
    require_parameters: false
  limits:
    rpm: 1_000 # requests/min across all providers
    tpm: 250_000 # tokens/min
    concurrent: 500
  generation:
    stream_default: true # matches OpenRouter streaming param  [oai_citation:2‡OpenRouter](https://openrouter.ai/docs/api-reference/overview)
    temperature: 0.7
    max_tokens: 4_096
  logging:
    level: info
    json: true
  metrics:
    prometheus_port: 9090
  features:
    tool_calling: true # feature-flag OpenRouter-compatible tools block  [oai_citation:3‡OpenRouter](https://openrouter.ai/docs/api-reference/overview)
    transforms: [] # e.g. ["nsfw_guard"]

# ─── Providers ────────────────────────────────────────────────────
providers:
  openai:
    endpoint: https://api.openai.com/v1
    auth_header: "Authorization: Bearer ${OPENAI_API_KEY}"
    # default params merged into every request sent to this provider
    defaults:
      retries: 2
      timeout: 30s
    models:
      - id: gpt-4o
        context: 128_000
        price_per_1k_tokens: 0.002
        supports: [stream, tools, json] # quick capability flags
      - id: gpt-3.5-turbo
        context: 16_000
        price_per_1k_tokens: 0.0005

  anthropic:
    endpoint: https://api.anthropic.com/v1
    auth_header: "X-Api-Key: ${ANTHROPIC_API_KEY}"
    models:
      - id: claude-3-opus
        context: 200_000
        price_per_1k_tokens: 0.003
        supports: [stream, tools]

# ─── Presets (optional, mirrors OpenRouter “named configs”) ───────
presets:
  email-copywriter:
    model: openai/gpt-4o
    system_prompt: |
      You are a persuasive email copywriter…
    temperature: 0.8
    provider_order: [openai, anthropic]
