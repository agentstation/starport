# Disposable stores for make test-integration. No application service is started.
services:
  valkey:
    image: valkey/valkey@sha256:9acdf6f0ae1771ea63c401e127054b2d1779227b9230dcfae37fa684610eaa4f
    ports:
      - "127.0.0.1:${STARPORT_VALKEY_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 1s
      timeout: 3s
      retries: 20
  postgres:
    image: postgres@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_DB: starport_test
    ports:
      - "127.0.0.1:${STARPORT_POSTGRES_PORT:-15432}:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "starport_test"]
      interval: 1s
      timeout: 3s
      retries: 20
