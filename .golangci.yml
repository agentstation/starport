# golangci-lint configuration v2
version: "2"

run:
  timeout: 5m
  tests: false

issues:
  # Exclude the scripts directory from all linting
  exclude-dirs:
    - scripts

linters:
  enable:
    - govet
    - errcheck
    - staticcheck
    - ineffassign
    - unused
    - misspell
    - gosec
    - goconst
    - gocyclo
    - dupl
    - revive
    - bodyclose
    - noctx