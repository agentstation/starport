# golangci-lint configuration v2
version: "2"

run:
  timeout: 5m
  tests: false

linters:
  exclusions:
    paths:
      - ^scripts/
  enable:
    - govet
    - errcheck
    - staticcheck
    - ineffassign
    - unused
    - misspell
    - gosec
    - goconst
    - gocyclo
    - dupl
    - revive
    - bodyclose
    - noctx
