version: 2

before:
  hooks:
    - go mod verify
    - bash scripts/generate-release-artifacts.sh build/release-artifacts

builds:
  - id: starport
    binary: starport
    main: ./cmd/starport
    env:
      - CGO_ENABLED=0
    mod_timestamp: "{{ .CommitTimestamp }}"
    flags:
      - -buildvcs=true
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.buildTime={{ .CommitDate }}
      - -X main.gitCommit={{ .ShortCommit }}
      - -X main.gitBranch=release
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: starport
    ids:
      - starport
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}
    files:
      - .env.example
      - LICENSE
      - README.md
      - SECURITY.md
      - src: build/release-artifacts/completions/*
        dst: completions
        strip_parent: true
      - src: build/release-artifacts/manpages/*
        dst: manpages
        strip_parent: true

homebrew_casks:
  - name: starport
    ids:
      - starport
    repository:
      owner: agentstation
      name: homebrew-tap
      branch: main
    directory: Casks
    commit_author:
      name: agentstation-release
      email: releases@agentstation.ai
    commit_msg_template: "Update starport to v{{ .Version }}"
    homepage: https://github.com/agentstation/starport
    description: OpenAI- and OpenRouter-compatible LLM inference gateway
    skip_upload: true
    binaries:
      - starport
    manpages:
      - manpages/starport.1
    completions:
      bash: completions/starport.bash
      zsh: completions/starport.zsh
      fish: completions/starport.fish
    hooks:
      post:
        install: |
          if OS.mac? && system_command("/usr/bin/xattr", args: ["-h"]).exit_status == 0
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/starport"], sudo: false
          end

# Sign and notarize macOS binaries when Apple credentials are available.
notarize:
  macos:
    - enabled: '{{ and (isEnvSet "MACOS_SIGN_P12") (isEnvSet "MACOS_SIGN_PASSWORD") (isEnvSet "MACOS_NOTARY_KEY") (isEnvSet "MACOS_NOTARY_KEY_ID") (isEnvSet "MACOS_NOTARY_ISSUER_ID") }}'
      ids:
        - starport
      sign:
        certificate: "{{ .Env.MACOS_SIGN_P12 }}"
        password: "{{ .Env.MACOS_SIGN_PASSWORD }}"
      notarize:
        issuer_id: "{{ .Env.MACOS_NOTARY_ISSUER_ID }}"
        key_id: "{{ .Env.MACOS_NOTARY_KEY_ID }}"
        key: "{{ .Env.MACOS_NOTARY_KEY }}"
        wait: true
        timeout: 20m

checksum:
  name_template: checksums.txt
  algorithm: sha256

sboms:
  - artifacts: archive
    documents:
      - "${artifact}.sbom.json"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - '^style:'
      - '^refactor:'
      - Merge pull request
      - Merge branch
  groups:
    - title: Features
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: Fixes
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: Performance
      regexp: '^.*?perf(\([[:word:]]+\))??!?:.+$'
      order: 2
    - title: Build and CI
      regexp: '^.*?(build|ci)(\([[:word:]]+\))??!?:.+$'
      order: 3
    - title: Other changes
      order: 999

release:
  github:
    owner: agentstation
    name: starport
  name_template: "Starport v{{ .Version }}"
  header: |
    Starport v{{ .Version }} is an OpenAI- and OpenRouter-compatible LLM
    inference gateway backed by the Starmap provider and model catalog.

    See the README and operator guide before deployment. Verify downloaded
    archives with `checksums.txt` and GitHub artifact attestations.
  footer: |
    **Full changelog:** https://github.com/agentstation/starport/compare/{{ .PreviousTag }}...{{ .Tag }}
  draft: true
  prerelease: auto
  make_latest: '{{ if .Prerelease }}false{{ else }}true{{ end }}'
  mode: keep-existing
